name: FTP debug

# Temporary debug run: tries FTP listing against both candidate hosts with
# visible errors, to find where the site files actually landed.
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Try FTP listing on both hosts
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          try_host() {
            echo "===== HOST: $1 ====="
            echo "--- login root ---"
            curl -m 60 -sS --ssl-reqd "ftps://${FTP_USERNAME}:${FTP_PASSWORD}@$1/" 2>&1 | head -30
            echo "--- public_html ---"
            curl -m 60 -sS --ssl-reqd "ftps://${FTP_USERNAME}:${FTP_PASSWORD}@$1/public_html/" 2>&1 | head -40
            echo "--- exit code: $? ---"
          }
          try_host "${FTP_SERVER}"
          try_host "srv1788-files.hstgr.io"

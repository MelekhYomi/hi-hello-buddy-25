# Netlify config — SPA fallback build.
#
# IMPORTANT: This project is built for Cloudflare Workers (SSR + server functions).
# Deploying to Netlify serves only the SPA shell — server functions (createServerFn),
# /api/* routes, and /sitemap.xml will NOT execute here. For full functionality,
# publish via Lovable (one click) which runs the Workers build.
#
# See DEPLOYMENT.md for details.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side routes don't 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
